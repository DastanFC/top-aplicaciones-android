<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // 🔧 CONFIGURACIÓN SUPABASE
    const SUPABASE_URL = "https://tabftlcqoeqcijztsgvt.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRhYmZ0bGNxb2VxY2lqenRzZ3Z0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1NTA5OTcsImV4cCI6MjA5NTEyNjk5N30.ie4YEln1GvzIsMtXfx2S9Ri0ZtBH4bRKbQcEr09uDxY";
    
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    document.getElementById('fecha-auto').innerText = new Date().toLocaleDateString('es-ES');
    
    async function cargarApps() {
        const { data: apps, error } = await sb
            .from('apps')
            .select('*')
            .order('created_at', { ascending: true });
        
        if (error) {
            console.error('Error:', error);
            document.getElementById('main-content').innerHTML = '<div class="loading">❌ Error al cargar aplicaciones</div>';
            return;
        }
        
        if (!apps || apps.length === 0) {
            document.getElementById('main-content').innerHTML = '<div class="loading">📭 No hay aplicaciones aún</div>';
            return;
        }
        
        // Agrupar por categoría
        const grouped = {};
        apps.forEach(app => {
            if (!grouped[app.categoria]) grouped[app.categoria] = [];
            grouped[app.categoria].push(app);
        });
        
        let html = '';
        for (let [categoria, appsCat] of Object.entries(grouped)) {
            const emoji = appsCat[0]?.emoji || '📱';
            html += `
                <section class="section">
                    <div class="section-header">
                        <div class="section-icon-emoji">${emoji}</div>
                        <h2 class="section-title">${escapeHtml(categoria)}</h2>
                        <span class="section-count">${appsCat.length} apps</span>
                    </div>
                    <div class="cards-grid">
            `;
            
            appsCat.forEach(app => {
                const warnClass = app.mostrar_aviso === 'si' ? ' warn' : '';
                html += `
                        <a href="${app.url}" class="app-card" target="_blank">
                            <div class="app-name">${escapeHtml(app.nombre)}</div>
                            <p class="app-desc">${escapeHtml(app.descripcion)}</p>
                            <div class="dl-btn${warnClass}">${app.tipo_boton} ${app.mostrar_aviso === 'si' ? '⚠️' : ''}</div>
                        </a>
                `;
            });
            
            html += `</div></section>`;
        }
        
        document.getElementById('main-content').innerHTML = html;
        actualizarContador(apps.length);
        generarChips();
    }
    
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    function actualizarContador(total) {
        let counter = document.querySelector('.hero-counter');
        if (!counter) {
            const hero = document.querySelector('.hero');
            const newCounter = document.createElement('p');
            newCounter.className = 'hero-counter';
            newCounter.innerHTML = `<span>${total}</span> aplicaciones recopiladas`;
            hero.appendChild(newCounter);
        } else {
            counter.innerHTML = `<span>${total}</span> aplicaciones recopiladas`;
        }
    }
    
    function generarChips() {
        const sections = document.querySelectorAll('.section');
        const chipsWrap = document.getElementById('chipsWrap');
        if (!chipsWrap) return;
        chipsWrap.innerHTML = '';
        sections.forEach(section => {
            const title = section.querySelector('.section-title')?.textContent;
            const emoji = section.querySelector('.section-icon-emoji')?.textContent;
            if (title) {
                const chip = document.createElement('button');
                chip.classList.add('chip');
                chip.textContent = (emoji || '') + ' ' + title;
                chip.addEventListener('click', () => {
                    section.scrollIntoView({ behavior: 'smooth', block: 'start' });
                });
                chipsWrap.appendChild(chip);
            }
        });
    }
    
    // Buscador
    const input = document.getElementById('buscador');
    const sinResultados = document.getElementById('sinResultados');
    
    input?.addEventListener('input', () => {
        const q = input.value.trim().toLowerCase();
        let alguna = false;
        
        document.querySelectorAll('.section').forEach(section => {
            let visibles = 0;
            section.querySelectorAll('.app-card').forEach(card => {
                const text = card.innerText.toLowerCase();
                const match = !q || text.includes(q);
                card.style.display = match ? 'flex' : 'none';
                if (match) visibles++;
            });
            section.style.display = visibles === 0 ? 'none' : 'block';
            if (visibles > 0) alguna = true;
        });
        
        sinResultados.style.display = (!alguna && q) ? 'block' : 'none';
    });
    
    // Modo oscuro
    const btnDark = document.getElementById('btnDark');
    const savedDark = localStorage.getItem('darkmode') === 'true';
    if (savedDark) { document.body.classList.add('dark'); btnDark.textContent = '☀️'; }
    
    btnDark?.addEventListener('click', () => {
        const isDark = document.body.classList.toggle('dark');
        btnDark.textContent = isDark ? '☀️' : '🌙';
        localStorage.setItem('darkmode', isDark);
    });
    
    // Botón subir
    const btnTop = document.getElementById('btnTop');
    window.addEventListener('scroll', () => {
        btnTop.classList.toggle('visible', window.scrollY > 300);
    });
    btnTop?.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
    
    cargarApps();
</script>
