<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = "https://tabftlcqoeqcijztsgvt.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRhYmZ0bGNxb2VxY2lqenRzZ3Z0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1NTA5OTcsImV4cCI6MjA5NTEyNjk5N30.ie4YEln1GvzIsMtXfx2S9Ri0ZtBH4bRKbQcEr09uDxY";
    
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    function getEmoji(categoria) {
        const emojis = {
            "Navegadores Web": "🌐", "Gestión de Archivos": "📁",
            "Launchers y personalización": "🎨", "Vida más fácil": "💡",
            "Tiempo y clima": "🌦️", "Emulación y Remote Play": "🕹️",
            "Galería de fotos": "🖼️", "Reproductores de vídeo": "🎞️",
            "Teclados": "⌨️", "Utilidades": "📱", "Power User (ADB)": "⚙️",
            "Streaming de audio": "🎵", "CINE Y TELEVISIÓN": "🎬", "Deportes": "⚽"
        };
        return emojis[categoria] || "📱";
    }
    
    async function checkSession() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) {
            document.getElementById('loginPanel').style.display = 'none';
            document.getElementById('adminContent').style.display = 'block';
            cargarApps();
        } else {
            document.getElementById('loginPanel').style.display = 'block';
            document.getElementById('adminContent').style.display = 'none';
        }
    }
    
    document.getElementById('btnLogin').addEventListener('click', async () => {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
        
        if (error) {
            document.getElementById('loginError').style.display = 'block';
            console.error('Login error:', error);
        } else {
            document.getElementById('loginPanel').style.display = 'none';
            document.getElementById('adminContent').style.display = 'block';
            cargarApps();
        }
    });
    
    document.getElementById('btnCerrarSesion').addEventListener('click', async () => {
        await supabaseClient.auth.signOut();
        document.getElementById('loginPanel').style.display = 'block';
        document.getElementById('adminContent').style.display = 'none';
        document.getElementById('email').value = '';
        document.getElementById('password').value = '';
    });
    
    async function cargarApps() {
        const { data: apps, error } = await supabaseClient
            .from('apps')
            .select('*')
            .order('created_at', { ascending: false });
        
        if (error) return;
        
        const stats = document.getElementById('stats');
        const total = apps.length;
        const porCategoria = {};
        apps.forEach(app => { porCategoria[app.categoria] = (porCategoria[app.categoria] || 0) + 1; });
        stats.innerHTML = `📊 Total: ${total} apps | 📂 Categorías: ${Object.keys(porCategoria).length}`;
        
        const container = document.getElementById('appList');
        if (!apps || apps.length === 0) {
            container.innerHTML = '<p style="color: #666;">📭 No hay aplicaciones</p>';
            return;
        }
        
        container.innerHTML = '';
        apps.forEach(app => {
            const div = document.createElement('div');
            div.className = 'app-item';
            div.innerHTML = `
                <div class="app-info">
                    <strong>${escapeHtml(app.nombre)}</strong>
                    <small>${app.categoria} | ${app.tipo_boton}</small>
                    <div style="font-size: 11px; color: #666; margin-top: 4px;">${escapeHtml(app.descripcion.substring(0, 60))}${app.descripcion.length > 60 ? '...' : ''}</div>
                </div>
                <button class="delete-btn" data-id="${app.id}">🗑️</button>
            `;
            container.appendChild(div);
        });
        
        document.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                const id = btn.dataset.id;
                await supabaseClient.from('apps').delete().eq('id', id);
                mostrarMensaje('✅ App eliminada');
                cargarApps();
            });
        });
    }
    
    document.getElementById('btnGuardar').addEventListener('click', async () => {
        const nuevaApp = {
            categoria: document.getElementById('categoria').value,
            nombre: document.getElementById('nombre').value.trim(),
            descripcion: document.getElementById('descripcion').value.trim(),
            url: document.getElementById('url').value.trim(),
            tipo_boton: document.getElementById('tipoBoton').value,
            mostrar_aviso: document.getElementById('mostrarAviso').value,
            emoji: getEmoji(document.getElementById('categoria').value)
        };
        
        if (!nuevaApp.nombre || !nuevaApp.descripcion || !nuevaApp.url) {
            mostrarMensaje('❌ Rellena todos los campos');
            return;
        }
        
        const { error } = await supabaseClient.from('apps').insert([nuevaApp]);
        
        if (error) {
            mostrarMensaje('❌ Error: ' + error.message);
        } else {
            mostrarMensaje('✅ App guardada correctamente');
            document.getElementById('nombre').value = '';
            document.getElementById('descripcion').value = '';
            document.getElementById('url').value = '';
            cargarApps();
        }
    });
    
    function mostrarMensaje(msg) {
        const el = document.getElementById('successMsg');
        el.textContent = msg;
        el.style.display = 'block';
        setTimeout(() => el.style.display = 'none', 2000);
    }
    
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    checkSession();
</script>
